# T-01 (odoo-development-unit-test/test-traps.md): the `setup:` block replays
# before every scenario in one un-rolled-back transaction, so every unique
# code it creates is generated per replay and each scenario has its own
# customer; documents are created with the default name `/`.
options:
  auto_refresh: true

setup:
  steps:
    - step: "Get the receivable account type"
      action: "ref"
      xml_id: "account.data_account_type_receivable"
      save_as: "receivable_acc_type"
    - step: "Get the current liabilities account type"
      action: "ref"
      xml_id: "account.data_account_type_current_liabilities"
      save_as: "liability_acc_type"
    - step: "Get the revenue account type"
      action: "ref"
      xml_id: "account.data_account_type_revenue"
      save_as: "income_acc_type"
    - step: "Create the receivable account"
      action: "create"
      model: "account.account"
      save_as: "receivable_account"
      values:
        code: "EVAL: 'SDAR%d' % env['account.account'].search_count([])"
        name: "Test School Deposit Accounting Receivable"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true
    - step: "Create the reconcilable deposit account"
      action: "create"
      model: "account.account"
      save_as: "deposit_account"
      values:
        code: "EVAL: 'SDAD%d' % env['account.account'].search_count([])"
        name: "Test School Deposit Accounting Liability"
        user_type_id: "REC: liability_acc_type.id"
        reconcile: true
    - step: "Create the income account of the payable invoice lines"
      action: "create"
      model: "account.account"
      save_as: "income_account"
      values:
        code: "EVAL: 'SDAI%d' % env['account.account'].search_count([])"
        name: "Test School Deposit Accounting Income"
        user_type_id: "REC: income_acc_type.id"
    - step: "Create the sale journal"
      action: "create"
      model: "account.journal"
      save_as: "sale_journal"
      values:
        name:
          "EVAL: 'Test SDA Sale Journal %d' % env['account.journal'].search_count([])"
        code: "EVAL: 'SDAS%d' % env['account.journal'].search_count([])"
        type: "sale"
    - step: "Create the general journal of the realization"
      action: "create"
      model: "account.journal"
      save_as: "general_journal"
      values:
        name:
          "EVAL: 'Test SDA General Journal %d' % env['account.journal'].search_count([])"
        code: "EVAL: 'SDAG%d' % env['account.journal'].search_count([])"
        type: "general"
    - step: "Create the deposit product"
      action: "create"
      model: "product.product"
      save_as: "source_product"
      values:
        name: "Test SDA Deposit Product"
        type: "service"
    - step: "Create the payable product"
      action: "create"
      model: "product.product"
      save_as: "target_product"
      values:
        name: "Test SDA Payable Product"
        type: "service"
    - step: "Create the manual-only payable product"
      action: "create"
      model: "product.product"
      save_as: "manual_product"
      values:
        name: "Test SDA Manual Payable Product"
        type: "service"
    - step: "Create a product that the deposit may not settle"
      action: "create"
      model: "product.product"
      save_as: "other_product"
      values:
        name: "Test SDA Other Product"
        type: "service"
    - step: "Create the auto-realize deposit type"
      action: "create"
      model: "school_deposit_type"
      save_as: "deposit_type"
      values:
        name: "Test SDA Auto Type"
        code: "EVAL: 'SDAT%d' % env['school_deposit_type'].search_count([])"
        deposit_account_id: "REC: deposit_account.id"
        realization_journal_id: "REC: general_journal.id"
        source_product_ids:
          - - 6
            - 0
            - - "REC: source_product.id"
        target_product_ids:
          - - 6
            - 0
            - - "REC: target_product.id"
    - step: "Create the manual-only deposit type"
      action: "create"
      model: "school_deposit_type"
      save_as: "manual_type"
      values:
        name: "Test SDA Manual Type"
        code: "EVAL: 'SDAM%d' % env['school_deposit_type'].search_count([])"
        deposit_account_id: "REC: deposit_account.id"
        realization_journal_id: "REC: general_journal.id"
        auto_realize: false
        source_product_ids:
          - - 6
            - 0
            - - "REC: source_product.id"
        target_product_ids:
          - - 6
            - 0
            - - "REC: manual_product.id"
    - step: "Create the customer"
      action: "create"
      model: "res.partner"
      save_as: "customer"
      values:
        name: "Test School Deposit Accounting Customer"
        is_company: true
    - step: "Create the customer invoice type"
      action: "create"
      model: "customer_invoice_type"
      save_as: "invoice_type"
      values:
        name: "Test SDA Invoice Type"
        code: "/"
        journal_id: "REC: sale_journal.id"
        receivable_account_id: "REC: receivable_account.id"

scenarios:
  - name: "School Deposit Accounting - Deposit larger than the invoice settles it fully"
    steps:
      - step: "Create the customer invoice dep_inv"
        action: "create"
        model: "customer_invoice"
        save_as: "dep_inv"
        values:
          type_id: "REC: invoice_type.id"
          partner_id: "REC: customer.id"
          date: 2026-07-15
          date_due: 2026-09-01
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: sale_journal.id"
          receivable_account_id: "REC: receivable_account.id"
      - step: "Create the line of dep_inv"
        action: "create"
        model: "customer_invoice.line"
        values:
          customer_invoice_id: "REC: dep_inv.id"
          product_id: "REC: source_product.id"
          name: "Line dep_inv"
          account_id: "REC: deposit_account.id"
          uom_quantity: 1
          price_unit: 1000.0
      - step: "Confirm dep_inv"
        action: "call"
        target: "dep_inv"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve dep_inv, which opens it"
        action: "call"
        target: "dep_inv"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the customer invoice target_inv"
        action: "create"
        model: "customer_invoice"
        save_as: "target_inv"
        values:
          type_id: "REC: invoice_type.id"
          partner_id: "REC: customer.id"
          date: 2026-08-01
          date_due: 2026-09-01
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: sale_journal.id"
          receivable_account_id: "REC: receivable_account.id"
      - step: "Create the line of target_inv"
        action: "create"
        model: "customer_invoice.line"
        values:
          customer_invoice_id: "REC: target_inv.id"
          product_id: "REC: target_product.id"
          name: "Line target_inv"
          account_id: "REC: income_account.id"
          uom_quantity: 1
          price_unit: 600.0
      - step: "Confirm target_inv"
        action: "call"
        target: "target_inv"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve target_inv, which opens it"
        action: "call"
        target: "target_inv"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true

      - step: "Find the realization of target_inv"
        action: "search"
        model: "school_deposit_realization"
        domain:
          - ["customer_invoice_id", "=", "REC: target_inv.id"]
        save_as: "realization"
        expect_count: 1

      - step: "Assert realization"
        action: "assert"
        target: "realization"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"
          amount_total:
            type: "value"
            expected: 600.0

      - step: "Assert target_inv"
        action: "assert"
        target: "target_inv"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"
          amount_residual:
            type: "value"
            expected: 0.0

      - step: "Find the deposit credit journal item"
        action: "search"
        model: "account.move.line"
        domain:
          - ["account_id", "=", "REC: deposit_account.id"]
          - ["partner_id", "=", "REC: customer.id"]
          - ["credit", ">", 0.0]
        save_as: "source_line"
        expect_count: 1

      - step: "Assert source_line"
        action: "assert"
        target: "source_line"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: -400.0
