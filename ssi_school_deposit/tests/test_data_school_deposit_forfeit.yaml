# T-01 (odoo-development-unit-test/test-traps.md): the `setup:` block replays
# before every scenario inside one un-rolled-back transaction, so every
# unique-constrained code it creates (account, journal, deposit type) is
# generated per replay, and each scenario gets its own customer (and hence
# its own deposit). Document numbers are not touched: documents are created
# with the default name `/`.
options:
  auto_refresh: true

setup:
  steps:
    - step: "Get the receivable account type"
      action: "ref"
      xml_id: "account.data_account_type_receivable"
      save_as: "receivable_acc_type"
    - step: "Get the current liabilities account type"
      action: "ref"
      xml_id: "account.data_account_type_current_liabilities"
      save_as: "liability_acc_type"
    - step: "Get the revenue account type"
      action: "ref"
      xml_id: "account.data_account_type_revenue"
      save_as: "income_acc_type"
    - step: "Create the receivable account"
      action: "create"
      model: "account.account"
      save_as: "receivable_account"
      values:
        code: "EVAL: 'SDFR%d' % env['account.account'].search_count([])"
        name: "Test School Deposit Forfeit Receivable"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true
    - step: "Create the reconcilable deposit account"
      action: "create"
      model: "account.account"
      save_as: "deposit_account"
      values:
        code: "EVAL: 'SDFD%d' % env['account.account'].search_count([])"
        name: "Test School Deposit Forfeit Liability"
        user_type_id: "REC: liability_acc_type.id"
        reconcile: true
    - step: "Create the forfeit income account"
      action: "create"
      model: "account.account"
      save_as: "forfeit_account"
      values:
        code: "EVAL: 'SDFF%d' % env['account.account'].search_count([])"
        name: "Test School Deposit Forfeit Income"
        user_type_id: "REC: income_acc_type.id"
    - step: "Create the income account of the payable invoice lines"
      action: "create"
      model: "account.account"
      save_as: "income_account"
      values:
        code: "EVAL: 'SDFI%d' % env['account.account'].search_count([])"
        name: "Test School Deposit Forfeit Invoice Income"
        user_type_id: "REC: income_acc_type.id"
    - step: "Create the sale journal"
      action: "create"
      model: "account.journal"
      save_as: "sale_journal"
      values:
        name:
          "EVAL: 'Test SDF Sale Journal %d' % env['account.journal'].search_count([])"
        code: "EVAL: 'SDFS%d' % env['account.journal'].search_count([])"
        type: "sale"
    - step: "Create the general journal of the realization and forfeit"
      action: "create"
      model: "account.journal"
      save_as: "general_journal"
      values:
        name:
          "EVAL: 'Test SDF General Journal %d' % env['account.journal'].search_count([])"
        code: "EVAL: 'SDFG%d' % env['account.journal'].search_count([])"
        type: "general"
    - step: "Create the deposit product"
      action: "create"
      model: "product.product"
      save_as: "source_product"
      values:
        name: "Test SDF Deposit Product"
        type: "service"
    - step: "Create the payable product"
      action: "create"
      model: "product.product"
      save_as: "target_product"
      values:
        name: "Test SDF Payable Product"
        type: "service"
    - step: "Create the product of the type without a forfeit account"
      action: "create"
      model: "product.product"
      save_as: "other_product"
      values:
        name: "Test SDF Other Product"
        type: "service"
    - step: "Create the deposit type with forfeit settings"
      action: "create"
      model: "school_deposit_type"
      save_as: "deposit_type"
      values:
        name: "Test SDF Type"
        code: "EVAL: 'SDFT%d' % env['school_deposit_type'].search_count([])"
        deposit_account_id: "REC: deposit_account.id"
        realization_journal_id: "REC: general_journal.id"
        forfeit_journal_id: "REC: general_journal.id"
        forfeit_account_id: "REC: forfeit_account.id"
        source_product_ids:
          - - 6
            - 0
            - - "REC: source_product.id"
        target_product_ids:
          - - 6
            - 0
            - - "REC: target_product.id"
    - step: "Create the deposit type without a forfeit account"
      action: "create"
      model: "school_deposit_type"
      save_as: "bare_type"
      values:
        name: "Test SDF Bare Type"
        code: "EVAL: 'SDFB%d' % env['school_deposit_type'].search_count([])"
        deposit_account_id: "REC: deposit_account.id"
        realization_journal_id: "REC: general_journal.id"
        forfeit_journal_id: "REC: general_journal.id"
        auto_realize: false
        source_product_ids:
          - - 6
            - 0
            - - "REC: source_product.id"
        target_product_ids:
          - - 6
            - 0
            - - "REC: other_product.id"
    - step: "Create the customer"
      action: "create"
      model: "res.partner"
      save_as: "customer"
      values:
        name: "Test School Deposit Forfeit Customer"
        is_company: true
    - step: "Create the customer invoice type"
      action: "create"
      model: "customer_invoice_type"
      save_as: "invoice_type"
      values:
        name: "Test SDF Invoice Type"
        code: "/"
        journal_id: "REC: sale_journal.id"
        receivable_account_id: "REC: receivable_account.id"
    - step: "Create the deposit invoice dep_inv of 1000"
      action: "create"
      model: "customer_invoice"
      save_as: "dep_inv"
      values:
        type_id: "REC: invoice_type.id"
        partner_id: "REC: customer.id"
        date: 2026-07-15
        date_due: 2026-09-01
        currency_id: "REF: base.USD"
        pricelist_id: "REF: product.list0"
        journal_id: "REC: sale_journal.id"
        receivable_account_id: "REC: receivable_account.id"
    - step: "Create the line of dep_inv"
      action: "create"
      model: "customer_invoice.line"
      values:
        customer_invoice_id: "REC: dep_inv.id"
        product_id: "REC: source_product.id"
        name: "Line dep_inv"
        account_id: "REC: deposit_account.id"
        uom_quantity: 1
        price_unit: 1000.0
    - step: "Confirm dep_inv"
      action: "call"
      target: "dep_inv"
      method: "action_confirm"
      as_user: "base.user_admin"
      refresh: true
      asserts:
        state:
          type: "value"
          expected: "confirm"
    - step: "Approve dep_inv, which opens it"
      action: "call"
      target: "dep_inv"
      method: "action_approve_approval"
      as_user: "base.user_admin"
      refresh: true
      asserts:
        state:
          type: "value"
          expected: "open"
    - step: "Find the deposit credit journal item"
      action: "search"
      model: "account.move.line"
      domain:
        - ["account_id", "=", "REC: deposit_account.id"]
        - ["partner_id", "=", "REC: customer.id"]
        - ["credit", ">", 0.0]
      save_as: "source_line"
      expect_count: 1

scenarios:
  - name: "School Deposit Forfeit - Forfeit the whole deposit through approval"
    steps:
      - step: "Create the forfeit without lines"
        action: "create"
        model: "school_deposit_forfeit"
        save_as: "forfeit"
        values:
          type_id: "REC: deposit_type.id"
          partner_id: "REC: customer.id"
          journal_id: "REC: general_journal.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"

      - step: "Compute the lines from the deposit of the partner"
        action: "call"
        target: "forfeit"
        method: "action_compute_line"
        refresh: true
        asserts:
          amount_total:
            type: "value"
            expected: 1000.0
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Confirm the forfeit"
        action: "call"
        target: "forfeit"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the forfeit, which finishes it"
        action: "call"
        target: "forfeit"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert the remaining deposit of the source is zero"
        action: "assert"
        target: "source_line"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: 0.0

      - step: "Find the credit on the forfeit account"
        action: "search"
        model: "account.move.line"
        domain:
          - ["account_id", "=", "REC: forfeit_account.id"]
          - ["partner_id", "=", "REC: customer.id"]
        save_as: "forfeit_line"
        expect_count: 1

      - step: "Assert the forfeit account holds 1000 as credit"
        action: "assert"
        target: "forfeit_line"
        asserts:
          credit:
            type: "value"
            expected: 1000.0
          debit:
            type: "value"
            expected: 0.0

  - name: "School Deposit Forfeit - After a partial realization only the rest is taken"
    steps:
      - step: "Create the customer invoice target_inv of 600"
        action: "create"
        model: "customer_invoice"
        save_as: "target_inv"
        values:
          type_id: "REC: invoice_type.id"
          partner_id: "REC: customer.id"
          date: 2026-08-01
          date_due: 2026-09-01
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: sale_journal.id"
          receivable_account_id: "REC: receivable_account.id"
      - step: "Create the line of target_inv"
        action: "create"
        model: "customer_invoice.line"
        values:
          customer_invoice_id: "REC: target_inv.id"
          product_id: "REC: target_product.id"
          name: "Line target_inv"
          account_id: "REC: income_account.id"
          uom_quantity: 1
          price_unit: 600.0
      - step: "Confirm target_inv"
        action: "call"
        target: "target_inv"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve target_inv, which opens it and realizes 600 of the deposit"
        action: "call"
        target: "target_inv"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true

      - step: "Assert 400 of the deposit is left"
        action: "assert"
        target: "source_line"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: -400.0

      - step: "Create the forfeit without lines"
        action: "create"
        model: "school_deposit_forfeit"
        save_as: "forfeit"
        values:
          type_id: "REC: deposit_type.id"
          partner_id: "REC: customer.id"
          journal_id: "REC: general_journal.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"

      - step: "Compute the lines, which take only the remaining 400"
        action: "call"
        target: "forfeit"
        method: "action_compute_line"
        refresh: true
        asserts:
          amount_total:
            type: "value"
            expected: 400.0
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

  - name: "School Deposit Forfeit - Cancelling a done forfeit restores the deposit"
    steps:
      - step: "Create the forfeit without lines"
        action: "create"
        model: "school_deposit_forfeit"
        save_as: "forfeit"
        values:
          type_id: "REC: deposit_type.id"
          partner_id: "REC: customer.id"
          journal_id: "REC: general_journal.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"

      - step: "Compute the lines"
        action: "call"
        target: "forfeit"
        method: "action_compute_line"
        refresh: true
        asserts:
          amount_total:
            type: "value"
            expected: 1000.0

      - step: "Finish the forfeit"
        action: "call"
        target: "forfeit"
        method: "action_done"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert the deposit of the source is used up"
        action: "assert"
        target: "source_line"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: 0.0

      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason"
        values:
          name: "SDF Cancel Reason"
          code: "EVAL: 'SDFCR%d' % env['base.cancel_reason'].search_count([])"

      - step: "Cancel the done forfeit via the wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "forfeit"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Assert the journal entry is gone"
        action: "assert"
        target: "forfeit"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "Assert the deposit of the source is restored"
        action: "assert"
        target: "source_line"
        refresh: true
        asserts:
          amount_residual:
            type: "value"
            expected: -1000.0

  - name: "School Deposit Forfeit - A line larger than the source item is rejected"
    steps:
      - step: "Create a draft forfeit with a line of 1500"
        action: "create"
        model: "school_deposit_forfeit"
        save_as: "forfeit"
        values:
          type_id: "REC: deposit_type.id"
          partner_id: "REC: customer.id"
          journal_id: "REC: general_journal.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - source_move_line_id: "REC: source_line.id"
                amount: 1500.0
      - step: "Assert the draft forfeit exists, which flushes pending writes"
        action: "assert"
        target: "forfeit"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Finishing a line larger than the source item is rejected"
        action: "call"
        target: "forfeit"
        method: "action_done"
        expect_error:
          type: "UserError"
          message_contains: "which only has"

  - name:
      "School Deposit Forfeit - A type without a forfeit account is rejected at done"
    steps:
      - step: "Create a draft forfeit of the type without a forfeit account"
        action: "create"
        model: "school_deposit_forfeit"
        save_as: "forfeit"
        values:
          type_id: "REC: bare_type.id"
          partner_id: "REC: customer.id"
          journal_id: "REC: general_journal.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - source_move_line_id: "REC: source_line.id"
                amount: 100.0
      - step: "Assert the draft forfeit exists, which flushes pending writes"
        action: "assert"
        target: "forfeit"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Finishing without a forfeit account is rejected"
        action: "call"
        target: "forfeit"
        method: "action_done"
        expect_error:
          type: "UserError"
          message_contains: "Forfeit Account"

  - name: "School Deposit Forfeit - Line Amount must be positive"
    steps:
      - step: "Create the forfeit without lines"
        action: "create"
        model: "school_deposit_forfeit"
        save_as: "forfeit"
        values:
          type_id: "REC: deposit_type.id"
          partner_id: "REC: customer.id"
          journal_id: "REC: general_journal.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"

      - step: "Assert the forfeit exists, which flushes pending writes"
        action: "assert"
        target: "forfeit"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "A line with a zero Amount is rejected"
        action: "create"
        model: "school_deposit_forfeit_line"
        values:
          forfeit_id: "REC: forfeit.id"
          source_move_line_id: "REC: source_line.id"
          amount: 0.0
        expect_error:
          type: "ValidationError"
          message_contains: "is not greater than zero"

  - name: "School Deposit Forfeit - Journal defaults from the Type"
    steps:
      - step: "Selecting the Type fills the Journal on the form"
        action: "form"
        model: "school_deposit_forfeit"
        save: false
        values:
          type_id: "REC: deposit_type"
        asserts:
          journal_id:
            type: "m2o"
            expected: "REC: general_journal"

  - name: "School Deposit Forfeit - Line Amount defaults to the source remainder"
    steps:
      - step: "Selecting the source journal item fills the Amount on the form"
        action: "form"
        model: "school_deposit_forfeit_line"
        save: false
        values:
          source_move_line_id: "REC: source_line"
        asserts:
          amount:
            type: "value"
            expected: 1000.0
