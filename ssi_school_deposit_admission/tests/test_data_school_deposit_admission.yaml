        target: "enrollment"
        refresh: true
        asserts:
          amount_deposit_realized:
            type: "value"
            expected: 600000.0
          amount_other_credit:
            type: "value"
            expected: 0.0

  - name: "Deposit Admission - Deposit of another partner is not used"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "SDAC Receivable"
          code: "SDACR"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "SDAC Income"
          code: "SDACI"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Setup - create deposit account"
        action: "create"
        model: "account.account"
        save_as: "deposit_account"
        values:
          name: "SDAC Deposit Liability"
          code: "SDACD"
          user_type_id: "REF: account.data_account_type_current_liabilities"
          reconcile: true

      - step: "Setup - create general journal"
        action: "create"
        model: "account.journal"
        save_as: "general_journal"
        values:
          name: "SDAC General"
          code: "SDACG"
          type: "general"

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "SDAC Invoice Type"
          code: "SDAC"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Setup - create deposit product"
        action: "create"
        model: "product.product"
        save_as: "deposit_product"
        values:
          name: "SDAC Deposit Product"
          type: "service"

      - step: "Setup - create fee product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "SDAC Fee Product"
          type: "service"
          list_price: 600000.0

      - step: "Setup - create pricelist"
        action: "create"
        model: "product.pricelist"
        save_as: "pricelist"
        values:
          name: "SDAC Pricelist"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create deposit type"
        action: "create"
        model: "school_deposit_type"
        save_as: "deposit_type"
        values:
          name: "SDAC Deposit Type"
          code: "SDATC"
          deposit_account_id: "REC: deposit_account.id"
          realization_journal_id: "REC: general_journal.id"
          source_product_ids:
            - - 6
              - 0
              - - "REC: deposit_product.id"
          target_product_ids:
            - - 6
              - 0
              - - "REC: product.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type SDAC"
          code: "GTSDAC"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 SDAC"
          code: "AYSDAC"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester SDAC"
          code: "SMSDAC"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School SDAC"
          code: "SCHSDAC"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade SDAC"
          code: "GSDAC"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact SDAC"

      - step: "Setup - create payment template"
        action: "create"
        model: "school_admission_payment_template"
        save_as: "payment_template"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          name: "Payment Template SDAC"
          code: "SDAPTC"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          academic_term_id: "REC: academic_term.id"
          term_ids:
            - - 0
              - 0
              - name: "Fee Term SDAC"
                sequence: 10
                detail_ids:
                  - - 0
                    - 0
                    - product_id: "REC: product.id"
                      name: "Fee Term line SDAC"
                      account_id: "REC: account.id"
                      uom_quantity: 1.0
                      uom_id: "REF: uom.product_uom_unit"
                      price_unit: 600000.0

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          user_id: "REF: base.user_admin"
          customer_invoice_type_id: "REC: ci_type.id"
          receivable_account_id: "REC: ci_account.id"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: contact.id"
          payment_template_id: "REC: payment_template.id"
          pricelist_id: "REC: pricelist.id"
          currency_id: "REC: company.currency_id.id"
          receivable_journal_id: "REC: ci_journal.id"

      - step: "Confirm admission"
        action: "call"
        target: "admission"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Compute payment"
        action: "call"
        target: "admission"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert admission is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "admission"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve admission"
        action: "call"
        target: "admission"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Get the fee_term"
        action: "search"
        model: "school_admission_payment_term"
        domain:
          - ["admission_id", "=", "REC: admission.id"]
          - ["name", "=", "Fee Term SDAC"]
        save_as: "fee_term"
        expect_count: 1

      - step: "Create the invoice of the fee_term"
        action: "call"
        target: "fee_term"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "Get the generated fee_inv"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "EVAL: registry['fee_term'].customer_invoice_id.id"]]
        save_as: "fee_inv"
        expect_count: 1

      - step: "Setup - create the other partner"
        action: "create"
        model: "res.partner"
        save_as: "other_partner"
        values:
          name: "Other Partner SDAC"

      - step: "Create the deposit invoice of the other partner"
        action: "create"
        model: "customer_invoice"
        save_as: "deposit_inv"
        values:
          type_id: "REC: ci_type.id"
          partner_id: "REC: other_partner.id"
          date: 2026-07-15
          date_due: 2026-09-01
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Create the deposit line"
        action: "create"
        model: "customer_invoice.line"
        values:
          customer_invoice_id: "REC: deposit_inv.id"
          product_id: "REC: deposit_product.id"
          name: "SDAC deposit"
          account_id: "REC: deposit_account.id"
          uom_quantity: 1
          price_unit: 400000.0

      - step: "Confirm the deposit invoice of the other partner"
        action: "call"
        target: "deposit_inv"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the deposit invoice of the other partner"
        action: "call"
        target: "deposit_inv"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true

      - step: "Confirm the fee invoice of the student"
        action: "call"
        target: "fee_inv"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the fee invoice of the student"
        action: "call"
        target: "fee_inv"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true

      - step: "Search realizations of the fee_inv"
        action: "search"
        model: "school_deposit_realization"
        domain: [["customer_invoice_id", "=", "REC: fee_inv.id"]]
        expect_count: 0

      - step: "Assert nothing was realized on the admission"
        action: "assert"
        target: "admission"
        refresh: true
        asserts:
          amount_deposit_realized:
            type: "value"
            expected: 0.0
          amount_paid:
            type: "value"
            expected: 0.0
